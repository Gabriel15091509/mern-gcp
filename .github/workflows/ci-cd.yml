name: 'CI/CD MERN Microservices GCP (PRO)'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: mern-devops-nouveau
  REGION: europe-west1
  ZONE: europe-west1-b
  CLUSTER: mern-cluster
  REGISTRY: europe-west1-docker.pkg.dev/mern-devops-nouveau/mern-repo
  NAMESPACE: mern-prod

jobs:

# -------------------------
# 1. QUALITY GATE
# -------------------------
  quality:
    name: "Quality Check"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [
          services/service-items,
          services/service-auth,
          services/service-health,
          client
        ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd ${{ matrix.service }} && npm ci

      - name: Lint (if exists)
        run: cd ${{ matrix.service }} && npm run lint || true

      - name: Test (non blocking)
        run: cd ${{ matrix.service }} && npm test -- --passWithNoTests

# -------------------------
# 2. BUILD & PUSH DOCKER
# -------------------------
  build:
    name: "Build & Push Images"
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # -------- function build ----------
      - name: Build & Push All Services
        run: |
          SERVICES=("service-items" "service-auth" "service-health" "frontend")

          for SERVICE in "${SERVICES[@]}"; do
            docker build \
              -t ${{ env.REGISTRY }}/$SERVICE:${{ github.sha }} \
              -t ${{ env.REGISTRY }}/$SERVICE:latest \
              ./services/$SERVICE 2>/dev/null || \
            docker build \
              -t ${{ env.REGISTRY }}/$SERVICE:${{ github.sha }} \
              -t ${{ env.REGISTRY }}/$SERVICE:latest \
              ./client

            docker push ${{ env.REGISTRY }}/$SERVICE:${{ github.sha }}
            docker push ${{ env.REGISTRY }}/$SERVICE:latest
          done

# -------------------------
# 3. DEPLOY GKE
# -------------------------
  deploy:
    name: "Deploy to GKE (Rolling Update)"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}

      # -------------------------
      # Rolling update microservices
      # -------------------------
      - name: Update Kubernetes Deployments
        run: |
          kubectl set image deployment/service-items \
            service-items=${{ env.REGISTRY }}/service-items:${{ github.sha }} -n ${{ env.NAMESPACE }}

          kubectl set image deployment/service-auth \
            service-auth=${{ env.REGISTRY }}/service-auth:${{ github.sha }} -n ${{ env.NAMESPACE }}

          kubectl set image deployment/service-health \
            service-health=${{ env.REGISTRY }}/service-health:${{ github.sha }} -n ${{ env.NAMESPACE }}

          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/frontend:${{ github.sha }} -n ${{ env.NAMESPACE }}

      # -------------------------
      # Rollout status (IMPORTANT)
      # -------------------------
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/service-items -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/service-auth -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/service-health -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }}

      # -------------------------
      # Health check post deploy
      # -------------------------
      - name: Post Deploy Health Check
        run: |
          INGRESS=$(kubectl get ingress mern-ingress -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          echo "Ingress IP: $INGRESS"

          curl -f http://$INGRESS/health || exit 1
          curl -f http://$INGRESS/api/items || exit 1

      # -------------------------
      # Rollback si échec (auto)
      # -------------------------
      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/service-items -n ${{ env.NAMESPACE }}
          kubectl rollout undo deployment/service-auth -n ${{ env.NAMESPACE }}
          kubectl rollout undo deployment/service-health -n ${{ env.NAMESPACE }}
          kubectl rollout undo deployment/frontend -n ${{ env.NAMESPACE }}