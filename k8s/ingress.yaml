apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mern-ingress
  namespace: mern-prod
  annotations:
    kubernetes.io/ingress.class: gce

spec:
  defaultBackend:
    service:
      name: frontend
      port:
        number: 80

  rules:
  - http:
      paths:

      - path: /api/items
        pathType: Prefix
        backend:
          service:
            name: service-items
            port:
              number: 3001

      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: service-auth
            port:
              number: 3002

      - path: /health
        pathType: Prefix
        backend:
          service:
            name: service-health
            port:
              number: 3003

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80