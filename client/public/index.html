<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beautiful Page</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b, #0ea5e9);
        color: white;
    }

    .card {
        width: 350px;
        padding: 30px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        text-align: center;
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-10px);
    }

    h1 {
        font-size: 28px;
        margin-bottom: 10px;
    }

    p {
        font-size: 14px;
        opacity: 0.8;
        margin-bottom: 20px;
    }

    .btn {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 10px;
        background: #0ea5e9;
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn:hover {
        background: #0284c7;
    }
</style>
</head>

<body>

<div class="card">
    <h1>Welcome ✨</h1>
    <p>Une page simple mais élégante avec un design moderne inspiré glassmorphism.</p>
    <a href="#" class="btn">Commencer</a>
</div>

</body>
</html>
